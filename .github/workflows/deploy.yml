# DISABLED by default — Cloudflare Workers Builds is the primary CI path
# (Dashboard: Workers → socwiki → Settings → Builds → connected to this repo).
#
# Keeping this file as a manual fallback only.
# Enable with: gh workflow enable "Deploy to Cloudflare Workers"
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare Workers

on:
  # Push deploys are handled by Cloudflare Workers Builds.
  # Uncomment the push trigger only if you disconnect CF Builds.
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle & deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
